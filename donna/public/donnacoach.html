<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donna — Your Executive Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidian: #0d0d0f;
    --charcoal: #1a1a1f;
    --slate: #252530;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5f0e8;
    --muted: #8a8a9a;
    --white: #ffffff;
    --danger: #e05a5a;
    --success: #5ab88a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--obsidian);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -40%;
    right: -20%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    background: rgba(13,13,15,0.95);
    backdrop-filter: blur(10px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .donna-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, #8b6914 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--obsidian);
    font-weight: 700;
    box-shadow: 0 0 0 2px rgba(201,168,76,0.3), 0 0 20px rgba(201,168,76,0.15);
    position: relative;
  }

  .donna-avatar::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    background: var(--success);
    border-radius: 50%;
    bottom: 1px;
    right: 1px;
    border: 2px solid var(--obsidian);
  }

  .brand-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  .brand-text p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid;
    font-weight: 500;
  }

  .pill-gold { border-color: rgba(201,168,76,0.4); color: var(--gold); background: rgba(201,168,76,0.06); }
  .pill-muted { border-color: rgba(138,138,154,0.3); color: var(--muted); background: rgba(138,138,154,0.05); }

  /* Quick-access topic bar */
  .topic-bar {
    display: flex;
    gap: 8px;
    padding: 12px 32px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
    position: relative;
    z-index: 5;
    background: rgba(26,26,31,0.6);
  }

  .topic-bar::-webkit-scrollbar { display: none; }

  .topic-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.02em;
  }

  .topic-btn:hover {
    border-color: rgba(201,168,76,0.4);
    color: var(--gold-light);
    background: rgba(201,168,76,0.06);
  }

  /* Chat area */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    z-index: 5;
    scrollbar-width: thin;
    scrollbar-color: rgba(201,168,76,0.2) transparent;
  }

  #chat-container::-webkit-scrollbar { width: 4px; }
  #chat-container::-webkit-scrollbar-track { background: transparent; }
  #chat-container::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 4px; }

  /* Messages */
  .message {
    display: flex;
    gap: 14px;
    max-width: 820px;
    animation: fadeSlideIn 0.35s ease forwards;
    opacity: 0;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; align-self: flex-end; }

  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Playfair Display', serif;
    margin-top: 2px;
  }

  .donna-msg-avatar {
    background: linear-gradient(135deg, var(--gold) 0%, #8b6914 100%);
    color: var(--obsidian);
    box-shadow: 0 0 12px rgba(201,168,76,0.2);
  }

  .user-msg-avatar {
    background: var(--slate);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .msg-bubble {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    max-width: 680px;
  }

  .donna-bubble {
    background: var(--charcoal);
    border: 1px solid rgba(201,168,76,0.12);
    color: var(--cream);
    border-radius: 4px 12px 12px 12px;
  }

  .user-bubble {
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--cream);
    border-radius: 12px 4px 12px 12px;
  }

  .msg-bubble strong {
    color: var(--gold-light);
    font-weight: 500;
  }

  .msg-bubble em {
    color: var(--muted);
    font-style: italic;
  }

  /* Callout boxes inside messages */
  .callout {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 6px;
    border-left: 3px solid;
    font-size: 13px;
  }

  .callout-gold { border-color: var(--gold); background: rgba(201,168,76,0.06); }
  .callout-red { border-color: var(--danger); background: rgba(224,90,90,0.06); }
  .callout-green { border-color: var(--success); background: rgba(90,184,138,0.06); }

  .callout-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  /* Typing indicator */
  .typing-indicator {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    background: var(--charcoal);
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: 4px 12px 12px 12px;
    width: fit-content;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.4;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  /* Input area */
  .input-area {
    padding: 16px 32px 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    background: rgba(13,13,15,0.95);
    backdrop-filter: blur(10px);
  }

  .input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--charcoal);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 10px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: rgba(201,168,76,0.5);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.05);
  }

  #user-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 120px;
    min-height: 22px;
  }

  #user-input::placeholder { color: var(--muted); }

  #send-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--gold) 0%, #8b6914 100%);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.1s;
    color: var(--obsidian);
  }

  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .input-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    padding: 0 4px;
  }

  /* Empty state */
  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    gap: 16px;
    padding: 40px;
  }

  .empty-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(201,168,76,0.15) 0%, rgba(201,168,76,0.03) 100%);
    border: 1px solid rgba(201,168,76,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .empty-state-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--cream);
    font-weight: 700;
  }

  .empty-state-sub {
    font-size: 14px;
    color: var(--muted);
    max-width: 380px;
    line-height: 1.6;
  }

  .starter-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 520px;
    width: 100%;
    margin-top: 8px;
  }

  .starter-card {
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    line-height: 1.4;
  }

  .starter-card:hover {
    border-color: rgba(201,168,76,0.3);
    color: var(--cream);
    background: rgba(201,168,76,0.05);
  }

  .starter-card strong {
    display: block;
    color: var(--cream);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    color: var(--gold-light);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="donna-avatar">D</div>
    <div class="brand-text">
      <h1>Donna</h1>
      <p>Executive Coach · Always On</p>
    </div>
  </div>
  <div class="header-pills">
    <span class="pill pill-gold">Sinek + Robbins Method</span>
    <span class="pill pill-muted">Agile EQ</span>
    <span class="pill pill-muted">Radical Candor</span>
  </div>
</header>

<div class="topic-bar">
  <button class="topic-btn" onclick="quickTopic('Emotional Intelligence')">🧠 Emotional Intelligence</button>
  <button class="topic-btn" onclick="quickTopic('Communication & Presence')">🗣️ Communication</button>
  <button class="topic-btn" onclick="quickTopic('Strategic Leadership')">🧭 Strategic Leadership</button>
  <button class="topic-btn" onclick="quickTopic('Conflict Resolution')">⚖️ Conflict Resolution</button>
  <button class="topic-btn" onclick="quickTopic('Design Thinking')">💡 Design Thinking</button>
  <button class="topic-btn" onclick="quickTopic('Change Management')">🔄 Change Management</button>
  <button class="topic-btn" onclick="quickTopic('Anti-Micromanagement')">🚫 Stop Micromanaging</button>
  <button class="topic-btn" onclick="quickTopic('Reframe a failure I just experienced')">🔥 Reframe a Failure</button>
</div>

<div id="chat-container">
  <div id="empty-state">
    <div class="empty-icon">D</div>
    <div class="empty-state-title">Ready when you are.</div>
    <div class="empty-state-sub">I'm Donna — your powerhouse partner. No fluff, no easy outs. Let's build the leader you're capable of becoming.</div>
    <div class="starter-grid">
      <button class="starter-card" onclick="sendStarter('My organization just changed strategy again and my team is frustrated. Help me lead through this.')"><strong>Change Leadership</strong>My org just pivoted — again. My team is frustrated.</button>
      <button class="starter-card" onclick="sendStarter('I need to have a difficult conversation with a colleague but I keep avoiding it. What do I do?')"><strong>Hard Conversations</strong>I keep avoiding a difficult conversation I need to have.</button>
      <button class="starter-card" onclick="sendStarter('I feel like I am micromanaging my team. How do I provide clarity without hovering?')"><strong>Presence vs. Control</strong>I think I'm micromanaging. How do I lead without hovering?</button>
      <button class="starter-card" onclick="sendStarter('Something went wrong on my team this week and I am feeling defeated. Help me reframe it.')"><strong>Future Reframe</strong>Something just went wrong and I'm feeling defeated.</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="user-input" placeholder="Tell Donna what's on your mind..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
</div>

<script>
// API key stored in localStorage — never hardcoded
function getApiKey() {
  let key = localStorage.getItem('donna_api_key');
  if (!key) {
    key = prompt('Enter your Anthropic API key to connect Donna:\n(stored locally in your browser only)');
    if (key) localStorage.setItem('donna_api_key', key.trim());
  }
  return key?.trim() || '';
}

const DONNA_SYSTEM = `You are "Donna," a world-class Executive Coach for high-performing leaders. Your coaching style blends Simon Sinek's "Start with Why" empathy with Mel Robbins' "5-Second Rule" directness and zero-tolerance for self-sabotage.

CORE PHILOSOPHY:
• The Sinek Side: Prioritize psychological safety, the "Infinite Game," and purpose behind every pivot. Leadership is a service, not a rank.
• The Robbins Side: Zero tolerance for busy work or self-sabotage. Challenge the user when they take the easy route. Push them toward action.

KEY DIRECTIVES:
1. NAVIGATE VOLATILITY: The user's organization changes direction constantly. Frame every change as a strategic puzzle, not a personal burden. Focus on "Agile EQ."
2. RADICAL CANDOR: Celebrate wins warmly. If the user is playing small or avoiding a hard conversation, call it out. Use phrases like "I'm going to stop you there because you're making excuses." or "That's the easy path and you know it."
3. FUTURE-FOCUSED REFRAMING: When the user reports a failure, acknowledge it briefly, then pivot: "What is the tuition we just paid for this lesson?"
4. ANTI-MICROMANAGEMENT: Nudge toward "Commander's Intent" — defining the destination, not the steps. Offer "Status-Free Check-In" questions that build EQ. Encourage "Active Listening Loops."
5. CORE SKILLS: Emotional Intelligence, Communication, Strategic Leadership, Conflict Resolution, Design Thinking, Change Management.

TONE: Sophisticated, witty, grounded, slightly provocative. You are the peer they can't hide from. Warm but unflinching.

FORMAT RULES:
- Use **bold** for key concepts or emphasis.
- Use line breaks generously for readability.
- Use "> " at the start of a line for powerful one-liners or Donna's signature challenges.
- Use "🔥 Donna's Challenge:" to call out when the user is playing small.
- Use "✦ The Lesson:" to reframe a failure.
- Keep responses conversational — not bullet-heavy listicles. Speak like a brilliant coach in a 1:1, not a consultant deck.
- Aim for 180-280 words per response unless depth is needed.`;

let conversationHistory = [];
let isTyping = false;

const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

function sendStarter(text) {
  userInput.value = text;
  sendMessage();
}

function quickTopic(topic) {
  userInput.value = `I want to work on: ${topic}. Where should I start?`;
  sendMessage();
}

function clearEmpty() {
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
}

function appendMessage(role, htmlContent) {
  clearEmpty();
  const msg = document.createElement('div');
  msg.className = `message ${role}`;

  const avatarDiv = document.createElement('div');
  avatarDiv.className = `msg-avatar ${role === 'donna' ? 'donna-msg-avatar' : 'user-msg-avatar'}`;
  avatarDiv.textContent = role === 'donna' ? 'D' : 'You';
  avatarDiv.style.fontSize = role === 'user' ? '10px' : '14px';

  const bubble = document.createElement('div');
  bubble.className = `msg-bubble ${role === 'donna' ? 'donna-bubble' : 'user-bubble'}`;
  bubble.innerHTML = htmlContent;

  msg.appendChild(avatarDiv);
  msg.appendChild(bubble);
  chatContainer.appendChild(msg);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showTyping() {
  clearEmpty();
  const typing = document.createElement('div');
  typing.className = 'message donna';
  typing.id = 'typing-msg';

  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar donna-msg-avatar';
  avatarDiv.textContent = 'D';

  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

  typing.appendChild(avatarDiv);
  typing.appendChild(indicator);
  chatContainer.appendChild(typing);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

function formatDonnaResponse(text) {
  // Convert markdown-ish to HTML
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

  // Handle blockquote-style lines
  text = text.replace(/^> (.+)$/gm, '<div class="callout callout-gold"><div class="callout-label">Donna Says</div>$1</div>');

  // Handle Donna's Challenge
  text = text.replace(/🔥 Donna's Challenge:(.*?)(?=\n\n|\n[A-Z]|$)/gs, (match, content) => {
    return `<div class="callout callout-red"><div class="callout-label" style="color:var(--danger)">🔥 Donna's Challenge</div>${content.trim()}</div>`;
  });

  // Handle The Lesson
  text = text.replace(/✦ The Lesson:(.*?)(?=\n\n|\n[A-Z]|$)/gs, (match, content) => {
    return `<div class="callout callout-green"><div class="callout-label" style="color:var(--success)">✦ The Lesson</div>${content.trim()}</div>`;
  });

  // Convert newlines to paragraphs
  const paras = text.split(/\n\n+/);
  return paras.map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<div')) return p;
    return `<p style="margin-bottom:8px">${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isTyping) return;

  isTyping = true;
  sendBtn.disabled = true;

  appendMessage('user', `<p>${text.replace(/\n/g, '<br>')}</p>`);
  userInput.value = '';
  userInput.style.height = 'auto';

  conversationHistory.push({ role: 'user', content: text });

  showTyping();

  try {
    const apiKey = getApiKey();
    if (!apiKey) {
      hideTyping();
      appendMessage('donna', '<p>No API key provided — I can\'t connect without one. Refresh and try again.</p>');
      isTyping = false;
      sendBtn.disabled = false;
      return;
    }

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: DONNA_SYSTEM,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    hideTyping();

    if (!response.ok) {
      const errMsg = data.error?.message || `API error ${response.status}`;
      if (response.status === 401) {
        localStorage.removeItem('donna_api_key');
        appendMessage('donna', `<p>That API key isn't valid — I've cleared it. Refresh and re-enter a working key.</p>`);
      } else {
        appendMessage('donna', `<p>Something went wrong: ${errMsg}</p>`);
      }
      isTyping = false;
      sendBtn.disabled = false;
      return;
    }

    const rawText = data.content?.[0]?.text || "I'm here — can you tell me more about what's going on?";
    conversationHistory.push({ role: 'assistant', content: rawText });
    appendMessage('donna', formatDonnaResponse(rawText));

  } catch (err) {
    hideTyping();
    appendMessage('donna', '<p>Something interrupted our session — please try again.</p>');
  }

  isTyping = false;
  sendBtn.disabled = false;
  userInput.focus();
}
</script>
</body>
</html>
